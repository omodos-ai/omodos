syntax = "proto3";

package ggo.schema.v1;

option go_package = "github.com/peterjbraam/ggo/pb/v1;pb";

// ==========================================
// GEMINI TAKEOUT SCHEMA (MyActivity.json)
// ==========================================

message GeminiTakeoutExport {
  repeated GeminiActivity activities = 1; 
}

message GeminiActivity {
  string header = 1;
  string title = 2;
  string time = 3;
  string content = 4; // Fallback plain text response
  repeated string products = 5;
  repeated string activity_controls = 6 [json_name = "activityControls"];
  
  // The actual LLM response is buried here
  repeated GeminiSafeHtmlItem safe_html_item = 7 [json_name = "safeHtmlItem"];
  
  // Attachment mapping (Google scatters files across these three keys)
  repeated string attached_files = 8 [json_name = "attachedFiles"];
  string image_file = 9 [json_name = "imageFile"];
  repeated GeminiSubtitle subtitles = 10;
}

message GeminiSafeHtmlItem {
  string html = 1; 
}

message GeminiSubtitle {
  string name = 1;
  string url = 2; 
}


// ==========================================
// CHATGPT EXPORT SCHEMA (conversations.json)
// ==========================================

message ChatGptExport {
  repeated ChatGptConversation conversations = 1;
}

message ChatGptConversation {
  string id = 1;
  string conversation_id = 2 [json_name = "conversation_id"];
  string title = 3;
  double create_time = 4 [json_name = "create_time"];
  double update_time = 5 [json_name = "update_time"];
  string current_node = 6 [json_name = "current_node"];        
  string default_model_slug = 7 [json_name = "default_model_slug"];
  string memory_scope = 8 [json_name = "memory_scope"];
  bool is_archived = 9 [json_name = "is_archived"];
  repeated string disabled_tool_ids = 10 [json_name = "disabled_tool_ids"];
  repeated string moderation_results = 11 [json_name = "moderation_results"];
  
  map<string, ChatGptNode> mapping = 12; 
}

message ChatGptNode {
  string id = 1;
  string parent = 2;
  ChatGptMessage message = 3; 
}

message ChatGptMessage {
  ChatGptAuthor author = 1;
  double create_time = 2 [json_name = "create_time"];
  ChatGptContent content = 3;
}

message ChatGptAuthor {
  string role = 1; 
}

message ChatGptContent {
  repeated string parts = 1;      
}
